worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx-platform.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format platform '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status dest="$http_sec_fetch_dest" origin="$http_origin"';
    access_log /dev/stdout platform;
    map $http_upgrade $platform_connection { default upgrade; '' close; }
    # Temporary embedding diagnostics. The custom desktop scheme remains
    # explicit because CSP's * does not include arbitrary non-HTTP(S) schemes.
    # Message authentication still accepts only PLATFORM_SSO_PARENT_ORIGINS.
    map $host $platform_frame_ancestors {
        default "* dsh-app://app";
    }
    # Fetch Metadata is absent for HTTP IP URLs and can be removed by proxies.
    # Only an explicit top-level navigation is denied here. The SPA also checks
    # window.parent and only authenticates a verified parent-origin handshake.
    map $http_sec_fetch_dest $platform_top_document { default 0; document 1; }
    server {
        listen 5175;
        server_name _;
        server_tokens off;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 256m;
        add_header Content-Security-Policy "frame-ancestors $platform_frame_ancestors" always;
        add_header X-Content-Type-Options nosniff always;
        # External URLs retain /weknora/. Rewrite internally to reuse all of
        # the application's existing API paths and its normal SPA routing.
        location = /weknora {
            if ($platform_top_document = 1) { return 404; }
            return 308 /weknora/;
        }
        location ^~ /weknora/ { rewrite ^/weknora/(.*)$ /$1 last; }
        location ~* ^/(login|register)/?$ { return 404; }
        location = /favicon.ico { return 204; }
        location ~ ^/(api/|mcp/|files(?:/|$)|r/|knowledge-bases/[^/]+/files) {
            proxy_pass http://127.0.0.1:18090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $platform_connection;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location ~* ^/assets/ { try_files $uri =404; expires 1y; }
        location ~* \.(js|mjs|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif|wasm|json|txt|pdf)$ {
            try_files $uri =404;
        }
        error_page 404 =404 @not_found;
        location @not_found {
            default_type text/plain;
            return 404 "404 Not Found\n";
        }
        location / {
            if ($platform_top_document = 1) { return 404; }
            add_header Cache-Control "no-store";
            add_header Content-Security-Policy "frame-ancestors $platform_frame_ancestors" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri $uri/ /index.html;
        }
    }
}
